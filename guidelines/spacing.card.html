<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base. 16 / 24 are the workhorses; 24 is the app gutter." -->
<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:flex-end;gap:8px}.c{text-align:center}.b{background:var(--color-violet-200);border-radius:3px}.n{font-size:9px;color:var(--text-quaternary);margin-top:5px}</style></head><body><div class="wrap">
<div class="row"><div class="c"><div class="b" style="width:4px;height:4px"></div><div class="n">4</div></div><div class="c"><div class="b" style="width:8px;height:8px"></div><div class="n">8</div></div><div class="c"><div class="b" style="width:12px;height:12px"></div><div class="n">12</div></div><div class="c"><div class="b" style="width:16px;height:16px"></div><div class="n">16</div></div><div class="c"><div class="b" style="width:20px;height:20px"></div><div class="n">20</div></div><div class="c"><div class="b" style="width:24px;height:24px"></div><div class="n">24</div></div><div class="c"><div class="b" style="width:32px;height:32px"></div><div class="n">32</div></div><div class="c"><div class="b" style="width:40px;height:40px"></div><div class="n">40</div></div><div class="c"><div class="b" style="width:48px;height:48px"></div><div class="n">48</div></div><div class="c"><div class="b" style="width:64px;height:64px"></div><div class="n">64</div></div><div class="c"><div class="b" style="width:80px;height:80px"></div><div class="n">80</div></div><div class="c"><div class="b" style="width:96px;height:96px"></div><div class="n">96</div></div></div></div></body></html>
