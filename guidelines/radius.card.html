<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.row{display:flex;gap:14px}.c{text-align:center}.b{width:64px;height:52px;background:var(--color-gray-50);border:1px solid var(--border-secondary)}.n{font-size:9.5px;color:var(--text-quaternary);margin-top:5px}</style></head><body><div class="wrap">
<div class="row"><div class="c"><div class="b" style="border-radius:4px"></div><div class="n">xs · 4</div></div><div class="c"><div class="b" style="border-radius:6px"></div><div class="n">sm · 6</div></div><div class="c"><div class="b" style="border-radius:8px"></div><div class="n">md · 8</div></div><div class="c"><div class="b" style="border-radius:10px"></div><div class="n">lg · 10</div></div><div class="c"><div class="b" style="border-radius:12px"></div><div class="n">xl · 12</div></div><div class="c"><div class="b" style="border-radius:16px"></div><div class="n">2xl · 16</div></div><div class="c"><div class="b" style="border-radius:20px"></div><div class="n">3xl · 20</div></div><div class="c"><div class="b" style="border-radius:24px"></div><div class="n">4xl · 24</div></div><div class="c"><div class="b" style="border-radius:999px"></div><div class="n">full · full</div></div></div></div></body></html>
