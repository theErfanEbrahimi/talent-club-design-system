<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.f{display:flex;height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--border-secondary)}.sb{width:150px;background:var(--app-sidebar-bg);padding:14px 10px;box-sizing:border-box}.lg{display:flex;align-items:center;justify-content:center;padding-bottom:16px}.lg img{height:22px}.it{display:flex;align-items:center;justify-content:flex-end;padding:9px 11px;border-radius:10px;color:var(--app-sidebar-fg);font-size:11px;font-weight:500;margin-bottom:3px}.it.on{background:var(--app-sidebar-item-active-bg);color:#fff;font-weight:700}.mn{flex:1;display:flex;flex-direction:column;background:var(--surface-page)}.hd{height:44px;background:var(--app-header-bg);border-bottom:1px solid var(--app-header-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;font-weight:700;color:var(--text-secondary)}.av{width:24px;height:24px;border-radius:50%;background:var(--color-violet-100);color:var(--color-violet-700);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.bd{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px}.cd{background:#fff;border:1px solid var(--card-border);border-radius:var(--card-radius);box-shadow:var(--shadow-xs);height:34px}</style></head><body><div class="wrap">
<div class="f"><aside class="sb"><div class="lg"><img src="../assets/logo-horizontal-brand.svg" alt="Talent Club" style="filter:brightness(0) invert(1)"></div>
<div class="it">فرم‌های OKR</div><div class="it on">ارزیابی عملکرد</div><div class="it">آموزش</div><div class="it">همکاران</div></aside>
<div class="mn"><div class="hd"><span class="av">م</span><span>خوش آمدید، مسعود</span></div><div class="bd"><div class="cd"></div><div class="cd"></div><div class="cd" style="height:60px"></div></div></div></div></div></body></html>
