<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Soft layered gray shadows, never colored. lg is the standard card." -->
<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.row{display:flex;gap:20px}.c{text-align:center}.b{width:84px;height:60px;background:#fff;border-radius:12px}.n{font-size:9.5px;color:var(--text-quaternary);margin-top:8px}</style></head><body><div class="wrap">
<div class="row"><div class="c"><div class="b" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div><div class="c"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div><div class="c"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div><div class="c"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div><div class="c"><div class="b" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl</div></div><div class="c"><div class="b" style="box-shadow:var(--shadow-2xl)"></div><div class="n">2xl</div></div></div></div></body></html>
