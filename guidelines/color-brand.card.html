<!-- @dsCard group="Colors" viewport="700x120" name="Brand — purple" subtitle="Primary interactive ramp. 600 is the default; 500/700 are hover and active." -->
<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap"><div class="sw"><div style="background:var(--color-brand-25);color:var(--color-gray-700)">25</div><div style="background:var(--color-brand-50);color:var(--color-gray-700)">50</div><div style="background:var(--color-brand-100);color:var(--color-gray-700)">100</div><div style="background:var(--color-brand-200);color:var(--color-gray-700)">200</div><div style="background:var(--color-brand-300);color:var(--color-gray-700)">300</div><div style="background:var(--color-brand-400);color:#fff">400</div><div style="background:var(--color-brand-500);color:#fff">500</div><div style="background:var(--color-brand-600);color:#fff">600</div><div style="background:var(--color-brand-700);color:#fff">700</div><div style="background:var(--color-brand-800);color:#fff">800</div><div style="background:var(--color-brand-900);color:#fff">900</div><div style="background:var(--color-brand-950);color:#fff">950</div></div></div></body></html>
