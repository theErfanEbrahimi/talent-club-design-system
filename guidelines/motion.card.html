<!-- @dsCard group="Spacing" viewport="700x130" name="Motion" subtitle="Four durations, plain eases. Panels slide in from the leading edge; nothing bounces." -->
<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.row{display:flex;gap:26px;align-items:center}.c{font-size:11px;color:var(--text-secondary)}.d{font-size:20px;font-weight:800;color:var(--color-violet-700)}.n{font-size:9.5px;color:var(--text-quaternary)}.px{width:34px;height:34px;border-radius:8px;background:var(--color-violet-600);animation:tc-panel-in 1.6s var(--ease-default) infinite alternate}.sp{color:var(--color-violet-600);animation:tc-spin 1.4s linear infinite;width:26px;height:26px}</style></head><body><div class="wrap">
<div class="row">
<div class="c"><div class="d">120<span style="font-size:11px">ms</span></div><div class="n">--duration-instant</div></div><div class="c"><div class="d">150<span style="font-size:11px">ms</span></div><div class="n">--duration-fast</div></div><div class="c"><div class="d">250<span style="font-size:11px">ms</span></div><div class="n">--duration-base</div></div><div class="c"><div class="d">400<span style="font-size:11px">ms</span></div><div class="n">--duration-slow</div></div>
<div class="c"><div class="px"></div><div class="n">tc-panel-in</div></div>
<div class="c"><svg class="sp" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.8 5.5 4.5 9.2 10 10-5.5.8-9.2 4.5-10 10-.8-5.5-4.5-9.2-10-10 5.5-.8 9.2-4.5 10-10z"/></svg><div class="n">tc-spin</div></div>
</div></div></body></html>
