<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.row{display:flex;gap:0;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid var(--border-secondary)}.c{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 12px}.n{font-size:9.5px;color:var(--text-quaternary);text-align:center;margin-top:8px}img{max-width:100%;max-height:78px}</style></head><body><div class="wrap">
<div class="row">
<div class="c" style="background:#fff"><img src="../assets/logo-horizontal-brand.svg" alt="Talent Club"></div>
<div class="c" style="background:var(--color-violet-950)"><img src="../assets/logo-vertical-white.svg" alt="Talent Club"></div>
<div class="c" style="background:var(--color-gray-50)"><img src="../assets/logo-vertical-brand.svg" alt="Talent Club"></div>
<div class="c" style="background:#fff"><img src="../assets/logo-icon-brand.svg" alt="Talent Club mark" style="max-height:52px"></div>
</div>
<div class="n">horizontal-brand · vertical-white on violet-950 · vertical-brand · icon-brand</div></div></body></html>
