<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.p{border:1px solid var(--ai-border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg)}.ph{display:flex;align-items:center;gap:7px;padding:10px 13px;background:var(--ai-surface);border-bottom:1px solid var(--color-violet-100);font-size:12px;font-weight:800;color:var(--ai-fg-strong)}.pb{padding:11px 13px;font-size:11px;line-height:2;color:var(--text-secondary)}.tip{background:var(--surface-accent-subtle);color:var(--color-violet-800);border-radius:8px;padding:7px 11px;font-size:10.5px;line-height:1.9}mark{border-radius:3px;padding:2px 0;background:none}.t{background:var(--mark-tone-bg);box-shadow:0 2px 0 var(--mark-tone-rule)}.b{background:var(--mark-bias-bg);box-shadow:0 2px 0 var(--mark-bias-rule)}.c{background:var(--mark-clarity-bg);box-shadow:0 2px 0 var(--mark-clarity-rule)}.lg{display:flex;gap:14px;margin-top:12px;font-size:10px;color:var(--text-tertiary)}.lg span span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}</style></head><body><div class="wrap">
<div class="g">
<div class="p"><div class="ph"><svg width="15" height="15" viewBox="0 0 24 24" fill="var(--color-violet-600)"><path d="M12 2c.8 5.5 4.5 9.2 10 10-5.5.8-9.2 4.5-10 10-.8-5.5-4.5-9.2-10-10 5.5-.8 9.2-4.5 10-10z"/></svg><span>دستیار بازخورد</span></div>
<div class="pb"><div class="tip">پیشنهادهای هوش مصنوعی ممکن است دقیق نباشند؛ تصمیم نهایی همیشه با شماست.</div></div></div>
<div><div class="pb" style="padding:0;font-size:12px">علی <mark class="t">همیشه</mark> در تحویل تسک‌ها تاخیر داره و به نظرم <mark class="b">خیلی بی‌دقته</mark>. <mark class="c">باید بهتر بشه.</mark></div>
<div class="lg"><span><span class="t"></span>لحن</span><span><span class="b"></span>سوگیری</span><span><span class="c"></span>شفافیت</span></div></div>
</div></div></body></html>
