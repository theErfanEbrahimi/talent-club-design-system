<!-- @dsCard group="Colors" viewport="700x150" name="Extended badge hues" subtitle="Seven extra hues the Badge kit adds, as 50 / 300 / 700 triples only." -->
<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.col span{display:block;height:26px}.cn{font-size:9.5px;color:var(--text-tertiary);text-align:center;margin-top:5px}</style></head><body><div class="wrap">
<div class="grid"><div class="col"><span style="background:var(--color-blue-light-50);border-radius:6px 6px 0 0"></span><span style="background:var(--color-blue-light-300)"></span><span style="background:var(--color-blue-light-700);border-radius:0 0 6px 6px"></span><div class="cn">blue-light</div></div><div class="col"><span style="background:var(--color-indigo-50);border-radius:6px 6px 0 0"></span><span style="background:var(--color-indigo-300)"></span><span style="background:var(--color-indigo-700);border-radius:0 0 6px 6px"></span><div class="cn">indigo</div></div><div class="col"><span style="background:var(--color-purple-50);border-radius:6px 6px 0 0"></span><span style="background:var(--color-purple-300)"></span><span style="background:var(--color-purple-700);border-radius:0 0 6px 6px"></span><div class="cn">purple</div></div><div class="col"><span style="background:var(--color-pink-50);border-radius:6px 6px 0 0"></span><span style="background:var(--color-pink-300)"></span><span style="background:var(--color-pink-700);border-radius:0 0 6px 6px"></span><div class="cn">pink</div></div><div class="col"><span style="background:var(--color-rose-50);border-radius:6px 6px 0 0"></span><span style="background:var(--color-rose-300)"></span><span style="background:var(--color-rose-700);border-radius:0 0 6px 6px"></span><div class="cn">rose</div></div><div class="col"><span style="background:var(--color-orange-50);border-radius:6px 6px 0 0"></span><span style="background:var(--color-orange-300)"></span><span style="background:var(--color-orange-700);border-radius:0 0 6px 6px"></span><div class="cn">orange</div></div><div class="col"><span style="background:var(--color-blue-gray-50);border-radius:6px 6px 0 0"></span><span style="background:var(--color-blue-gray-300)"></span><span style="background:var(--color-blue-gray-700);border-radius:0 0 6px 6px"></span><div class="cn">blue-gray</div></div></div></div></body></html>
