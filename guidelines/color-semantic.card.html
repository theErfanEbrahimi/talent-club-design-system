<!-- @dsCard group="Colors" viewport="700x180" name="Semantic aliases" subtitle="Always reach for these in product code, never a raw ramp step." -->
<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--color-white);color:var(--text-primary)}
.wrap{padding:18px 22px}
.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:700;margin:0 0 8px}
.hex{display:flex;gap:0;margin-top:6px}.hex>span{flex:1;text-align:center;font-size:8.5px;color:var(--text-quaternary);font-variant-numeric:tabular-nums}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}.r{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text-secondary)}.ch{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-secondary);flex:none}code{font-size:10.5px;color:var(--text-tertiary)}</style></head><body><div class="wrap">
<div class="rows"><div class="r"><span class="ch" style="background:var(--text-primary)"></span><code>--text-primary</code><span>متن اصلی</span></div><div class="r"><span class="ch" style="background:var(--surface-page)"></span><code>--surface-page</code><span>پس‌زمینه صفحه</span></div><div class="r"><span class="ch" style="background:var(--text-tertiary)"></span><code>--text-tertiary</code><span>متن کم‌رنگ</span></div><div class="r"><span class="ch" style="background:var(--surface-accent-subtle)"></span><code>--surface-accent-subtle</code><span>سطح دستیار</span></div><div class="r"><span class="ch" style="background:var(--border-secondary)"></span><code>--border-secondary</code><span>مرز کارت</span></div><div class="r"><span class="ch" style="background:var(--fg-accent)"></span><code>--fg-accent</code><span>آیکون برند</span></div><div class="r"><span class="ch" style="background:var(--text-link)"></span><code>--text-link</code><span>لینک</span></div><div class="r"><span class="ch" style="background:var(--focus-ring)"></span><code>--focus-ring</code><span>حلقه فوکوس</span></div></div></div></body></html>
